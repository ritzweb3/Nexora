<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora — Campaigns verified by hand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b0a;
    --bg-raised: #0d1412;
    --panel: #101917;
    --panel-2: #131f1c;
    --border: #1f2f2a;
    --border-soft: #182420;
    --text: #eef4f0;
    --text-muted: #93a69d;
    --text-faint: #5d6f68;
    --accent: #c8ff4d;
    --accent-dim: #8fb536;
    --accent-ink: #0c1400;
    --danger: #ff7a5c;
    --danger-dim: #4a2a22;
    --warn: #ffcf6b;
    --font-display: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f7f2;
      --bg-raised: #ffffff;
      --panel: #ffffff;
      --panel-2: #eef3ea;
      --border: #dbe4d5;
      --border-soft: #e6ede1;
      --text: #101915;
      --text-muted: #55645b;
      --text-faint: #8b978f;
      --accent: #4e7a0e;
      --accent-dim: #6f9a1f;
      --accent-ink: #ffffff;
      --danger: #b5402a;
      --danger-dim: #f6ddd6;
      --warn: #8a6a12;
    }
  }
  :root[data-theme="dark"] {
    --bg: #070b0a; --bg-raised: #0d1412; --panel: #101917; --panel-2: #131f1c;
    --border: #1f2f2a; --border-soft: #182420; --text: #eef4f0; --text-muted: #93a69d;
    --text-faint: #5d6f68; --accent: #c8ff4d; --accent-dim: #8fb536; --accent-ink: #0c1400;
    --danger: #ff7a5c; --danger-dim: #4a2a22; --warn: #ffcf6b;
  }
  :root[data-theme="light"] {
    --bg: #f4f7f2; --bg-raised: #ffffff; --panel: #ffffff; --panel-2: #eef3ea;
    --border: #dbe4d5; --border-soft: #e6ede1; --text: #101915; --text-muted: #55645b;
    --text-faint: #8b978f; --accent: #4e7a0e; --accent-dim: #6f9a1f; --accent-ink: #ffffff;
    --danger: #b5402a; --danger-dim: #f6ddd6; --warn: #8a6a12;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    min-height: 100vh;
  }
  #app { min-height: 100vh; }
  a { color: inherit; }
  img { max-width: 100%; }
  .wrap { max-width: 100%; overflow-x: auto; }
  h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; }
  button, input, select, textarea { font-family: inherit; font-size: 15px; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 20px; border-radius: var(--radius-sm); border: 1px solid transparent;
    font-weight: 600; font-size: 14.5px; transition: transform 0.08s ease, background 0.15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--text-faint); }
  .btn-line { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn-line:hover { color: var(--text); border-color: var(--text-faint); }
  .btn-danger { background: var(--danger-dim); color: var(--danger); border: 1px solid var(--danger); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 8px 14px; font-size: 13.5px; }

  /* ---------- Layout shells ---------- */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px clamp(20px, 5vw, 56px); border-bottom: 1px solid var(--border-soft);
    position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
  .nav-links { display: flex; align-items: center; gap: 28px; font-size: 14.5px; color: var(--text-muted); }
  .nav-links a { text-decoration: none; }
  .nav-links a:hover { color: var(--text); }
  .nav-actions { display: flex; align-items: center; gap: 12px; }
  .nav-menu-btn { display: none; }

  .container { max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 56px); }

  /* ---------- Landing ---------- */
  .hero { padding: clamp(56px, 10vw, 120px) 0 clamp(40px, 8vw, 80px); }
  .hero-grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 48px; align-items: end; }
  .hero h1 { font-size: clamp(38px, 5.2vw, 68px); line-height: 1.04; font-weight: 700; }
  .hero .accent-word { color: var(--accent); }
  .hero-sub { margin-top: 22px; font-size: 18px; color: var(--text-muted); max-width: 52ch; }
  .hero-cta { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-stats { display: flex; flex-direction: column; gap: 22px; padding-left: 8px; border-left: 1px solid var(--border); }
  .stat-num { font-family: var(--font-display); font-size: 30px; font-weight: 600; color: var(--accent); }
  .stat-label { font-size: 13.5px; color: var(--text-muted); margin-top: 2px; }

  .section { padding: clamp(48px, 7vw, 84px) 0; border-top: 1px solid var(--border-soft); }
  .section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 36px; flex-wrap: wrap; }
  .section-head h2 { font-size: clamp(26px, 3vw, 36px); max-width: 22ch; }
  .section-head p { color: var(--text-muted); max-width: 46ch; font-size: 15.5px; }

  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .step-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; }
  .step-num { font-family: var(--font-display); font-size: 26px; color: var(--accent); font-weight: 600; }
  .step-card h3 { font-size: 17px; margin-top: 14px; }
  .step-card p { color: var(--text-muted); font-size: 14.5px; margin-top: 8px; }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .persona-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; display: flex; flex-direction: column; gap: 16px; }
  .persona-card h3 { font-size: 22px; }
  .persona-card p { color: var(--text-muted); font-size: 15px; }
  .persona-list { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--text-muted); }
  .persona-list li { display: flex; gap: 8px; align-items: flex-start; }
  .persona-list li::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-top: 8px; flex-shrink: 0; }

  .algo-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: clamp(24px,4vw,40px); display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .algo-formula { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; font-family: 'Space Grotesk', monospace; font-size: 14px; color: var(--accent); line-height: 1.9; overflow-x: auto; white-space: pre; }
  .algo-list { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .algo-list li { font-size: 14.5px; color: var(--text-muted); }
  .algo-list b { color: var(--text); font-weight: 600; }

  .footer { padding: 32px clamp(20px,5vw,56px); border-top: 1px solid var(--border-soft); display: flex; justify-content: space-between; color: var(--text-faint); font-size: 13px; flex-wrap: wrap; gap: 12px; }

  /* ---------- Auth pages ---------- */
  .auth-shell { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .auth-side { background: var(--panel-2); display: flex; flex-direction: column; justify-content: space-between; padding: 40px; border-right: 1px solid var(--border-soft); }
  .auth-side-quote { font-family: var(--font-display); font-size: 26px; line-height: 1.3; max-width: 34ch; }
  .auth-side-foot { color: var(--text-muted); font-size: 13.5px; }
  .auth-main { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .auth-box { width: 100%; max-width: 400px; }
  .auth-box h2 { font-size: 26px; margin-bottom: 6px; }
  .auth-box .sub { color: var(--text-muted); font-size: 14.5px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 13px; background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field-hint { font-size: 12px; color: var(--text-faint); margin-top: 5px; }
  .role-toggle { display: flex; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 22px; }
  .role-toggle button { flex: 1; background: transparent; border: none; padding: 9px; border-radius: 5px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); }
  .role-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--text-faint); font-size: 12.5px; margin: 20px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .social-row { display: flex; flex-direction: column; gap: 10px; }
  .social-btn { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 11px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-raised); font-size: 14px; font-weight: 500; }
  .social-btn:hover { border-color: var(--text-faint); }
  .foot-link { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
  .foot-link button { background: none; border: none; color: var(--accent); font-weight: 600; padding: 0; }
  .seed-box { display: flex; flex-direction: column; gap: 10px; }
  .seed-box textarea { min-height: 74px; resize: vertical; font-family: 'Space Grotesk', monospace; font-size: 13px; }
  .notice { font-size: 12px; color: var(--text-faint); background: var(--bg-raised); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 6px; }
  .error-box { background: var(--danger-dim); border: 1px solid var(--danger); color: var(--danger); font-size: 13.5px; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 16px; }
  .toast-stack { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; max-width: min(340px, calc(100vw - 40px)); }
  .toast { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: 13px 16px; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); animation: toastIn .18s ease; }
  .toast.err { border-left-color: var(--danger); }
  @keyframes toastIn { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform: translateY(0);} }

  /* ---------- App shell (dashboards) ---------- */
  .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background: var(--panel-2); border-right: 1px solid var(--border-soft); padding: 22px 16px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .sidebar-brand { padding: 6px 10px 22px; display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .sidebar-brand svg { width: 22px; height: 22px; }
  .side-role { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); padding: 0 10px 10px; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; }
  .side-link { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 14px; font-weight: 500; text-decoration: none; border: none; background: transparent; text-align: left; width: 100%; }
  .side-link:hover { background: var(--bg-raised); color: var(--text); }
  .side-link.active { background: var(--bg-raised); color: var(--text); }
  .side-link.active .dot { background: var(--accent); }
  .side-link .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .sidebar-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-soft); }
  .user-chip { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 13.5px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .main { padding: 28px clamp(20px, 3vw, 40px) 60px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 14px; }
  .topbar h1 { font-size: 24px; }
  .topbar .sub { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

  .grid-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; }
  .card-label { font-size: 12.5px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
  .card-value { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin-top: 10px; }
  .card-foot { font-size: 12.5px; color: var(--text-faint); margin-top: 6px; }
  .pill { font-size: 11.5px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
  .pill-accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .pill-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill-danger { background: var(--danger-dim); color: var(--danger); }
  .pill-muted { background: var(--border-soft); color: var(--text-muted); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 22px; margin-bottom: 20px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .panel-head h3 { font-size: 16.5px; }
  .panel-head .sub { font-size: 13px; color: var(--text-muted); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--text-faint); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 0 12px 10px; border-bottom: 1px solid var(--border-soft); }
  td { padding: 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .row-name { font-weight: 600; }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-state h4 { color: var(--text); margin-bottom: 6px; font-size: 15px; }

  .social-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .social-item { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg-raised); }
  .social-item .plat { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
  .social-item input { max-width: 130px; padding: 7px 9px; font-size: 13px; }

  .camp-card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; margin-bottom: 12px; background: var(--bg-raised); }
  .camp-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .camp-title { font-weight: 600; font-size: 15.5px; }
  .camp-meta { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
  .camp-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .submit-row { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 8px; margin-top: 14px; align-items: end; }
  .submit-row .field { margin-bottom: 0; }

  .bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; height: 100%; }
  .bar { width: 100%; max-width: 34px; background: var(--accent); border-radius: 4px 4px 0 0; }
  .bar.alt { background: var(--border); }
  .bar-label { font-size: 11px; color: var(--text-faint); }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 26px; width: 100%; max-width: 420px; }
  .modal h3 { font-size: 18px; margin-bottom: 4px; }
  .modal .sub { color: var(--text-muted); font-size: 13.5px; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

  .wallet-hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 20px; }
  .wallet-balance-card { background: linear-gradient(135deg, var(--panel-2), var(--panel)); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 26px; }
  .wallet-balance-num { font-family: var(--font-display); font-size: 40px; font-weight: 700; color: var(--accent); margin-top: 6px; }
  .wallet-addr { font-family: 'Space Grotesk', monospace; font-size: 12.5px; color: var(--text-muted); background: var(--bg-raised); padding: 8px 10px; border-radius: 6px; margin-top: 14px; word-break: break-all; }

  .flag-note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--danger); background: var(--danger-dim); padding: 8px 10px; border-radius: 6px; margin-top: 8px; }

  .badge-warning-banner { background: var(--danger-dim); border: 1px solid var(--danger); color: var(--danger); border-radius: var(--radius-md); padding: 14px 18px; font-size: 13.5px; margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-start; }

  @media (max-width: 980px) {
    .hero-grid { grid-template-columns: 1fr; }
    .hero-stats { flex-direction: row; border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 20px; gap: 28px; flex-wrap: wrap; }
    .steps { grid-template-columns: 1fr 1fr; }
    .split { grid-template-columns: 1fr; }
    .algo-panel { grid-template-columns: 1fr; }
    .auth-shell { grid-template-columns: 1fr; }
    .auth-side { display: none; }
    .grid-cards { grid-template-columns: 1fr 1fr; }
    .app-shell { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 14px 16px; }
    .sidebar-brand { padding: 0; margin-right: auto; }
    .side-nav { flex-direction: row; flex-wrap: wrap; }
    .sidebar-foot { margin-top: 0; padding-top: 0; border-top: none; }
    .nav-links { display: none; }
    .wallet-hero { grid-template-columns: 1fr; }
    .submit-row { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 600px) {
    .steps { grid-template-columns: 1fr; }
    .grid-cards { grid-template-columns: 1fr 1fr; }
    .social-grid { grid-template-columns: 1fr; }
    .submit-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-stack" id="toastStack"></div>
<script>
(function(){
"use strict";

/* =========================================================
   UTIL
========================================================= */
function fmtMoney(n){
  n = Number(n)||0;
  return "$" + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtNum(n){ return n===null||n===undefined ? "—" : Number(n).toLocaleString(); }
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function timeAgo(ts){
  if(!ts) return "—";
  var diff = Date.now() - ts;
  var m = Math.floor(diff/60000);
  if(m < 1) return "just now";
  if(m < 60) return m+"m ago";
  var h = Math.floor(m/60);
  if(h < 24) return h+"h ago";
  var d = Math.floor(h/24);
  return d+"d ago";
}
function initials(name){
  return String(name||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||"";}).join("").toUpperCase();
}
function toast(msg, isErr){
  var stack = document.getElementById("toastStack");
  var el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(function(){ el.style.opacity="0"; el.style.transition="opacity .25s"; setTimeout(function(){ el.remove(); }, 250); }, 3600);
}

/* =========================================================
   API CLIENT — same-origin, no base URL or CORS config needed
========================================================= */
function getToken(){ try{ return localStorage.getItem("nexora_token"); }catch(e){ return null; } }
function getRole(){ try{ return localStorage.getItem("nexora_role"); }catch(e){ return null; } }
function setSession(token, role){ try{ localStorage.setItem("nexora_token", token); localStorage.setItem("nexora_role", role); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem("nexora_token"); localStorage.removeItem("nexora_role"); }catch(e){} }

async function api(path, opts){
  opts = opts || {};
  var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  var token = getToken();
  if(token) headers["Authorization"] = "Bearer " + token;
  var res = await fetch(path, Object.assign({}, opts, { headers: headers }));
  var data = null;
  try { data = await res.json(); } catch(e) { data = null; }
  if(!res.ok){
    var err = new Error((data && data.error) || ("Request failed (" + res.status + ")"));
    err.status = res.status;
    throw err;
  }
  return data;
}
function apiGet(path){ return api(path); }
function apiPost(path, body){ return api(path, { method: "POST", body: JSON.stringify(body || {}) }); }
function apiPut(path, body){ return api(path, { method: "PUT", body: JSON.stringify(body || {}) }); }

/* =========================================================
   ROUTER
========================================================= */
var routes = {};
function route(path, fn){ routes[path] = fn; }
function navigate(path){ window.location.hash = path; }
function currentPath(){ return (window.location.hash || "#/").replace("#",""); }

var renderGen = 0;
async function render(){
  var myGen = ++renderGen;
  var fullPath = currentPath();
  var base = fullPath.split("?")[0];
  var handler = routes[base] || routes["/404"];
  var app = document.getElementById("app");
  app.innerHTML = loadingShell();
  try{
    var html = await handler();
    if(myGen !== renderGen) return;
    app.innerHTML = html;
    window.scrollTo(0,0);
    wireGlobal();
  }catch(e){
    if(myGen !== renderGen) return;
    if(e.silent) return;
    if(e.status === 401){
      clearSession();
      toast("Please log in again.", true);
      navigate("/login");
      return;
    }
    app.innerHTML = errorShell(e.message);
    wireGlobal();
  }
}
window.addEventListener("hashchange", render);

function loadingShell(){
  return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;">Loading…</div>';
}
function errorShell(msg){
  return marketingNav() + '<div class="container"><div class="section"><div class="empty-state"><h4>Something went wrong</h4><p>'+escapeHtml(msg)+'</p><br><button class="btn btn-primary" data-nav="/">Back to Nexora</button></div></div></div>';
}
function requireRole(expected){
  var token = getToken(), role = getRole();
  if(!token || role !== expected){
    navigate("/login");
    throw Object.assign(new Error("Not authenticated"), { silent: true });
  }
}

/* =========================================================
   EVENT WIRING
========================================================= */
function wireGlobal(){
  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.addEventListener("click", function(){ navigate(el.getAttribute("data-nav")); });
  });
  var logoutBtn = document.querySelector('[data-action="logout"]');
  if(logoutBtn) logoutBtn.addEventListener("click", function(){ clearSession(); navigate("/"); });

  var signupForm = document.getElementById("signupForm");
  if(signupForm){
    signupForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var kind = currentPath().indexOf("project")>-1 ? "project" : "creator";
      var data = new FormData(signupForm);
      if(kind === "creator" && !isValidEthAddress(data.get("walletAddress"))){
        showFormErr("Enter a valid ETH wallet address (0x followed by 40 hex characters).");
        return;
      }
      try{
        var result = await apiPost("/auth/signup", { role: kind, name: data.get("name"), email: data.get("email"), password: data.get("password"), walletAddress: data.get("walletAddress") });
        setSession(result.token, result.role);
        toast("Welcome to Nexora, "+firstName(data.get("name"))+"!");
        navigate(kind === "project" ? "/project" : "/creator");
      }catch(err){ showFormErr(err.message); }
    });
  }

  var walletGateForm = document.getElementById("walletGateForm");
  if(walletGateForm){
    walletGateForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var data = new FormData(walletGateForm);
      var addr = data.get("walletAddress");
      if(!isValidEthAddress(addr)){ showFormErr("Enter a valid ETH wallet address (0x followed by 40 hex characters)."); return; }
      try{
        await apiPut("/creators/me/wallet", { walletAddress: addr });
        toast("Wallet address saved.");
        render();
      }catch(err){ showFormErr(err.message); }
    });
  }

  var loginForm = document.getElementById("loginForm");
  if(loginForm){
    loginForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var data = new FormData(loginForm);
      var role = data.get("role");
      var email = data.get("email"), password = data.get("password");
      try{
        var result = await apiPost("/auth/login", { role: role, email: email, password: password });
        setSession(result.token, result.role);
        navigate(role === "project" ? "/project" : "/creator");
      }catch(err){
        try{
          var adminResult = await apiPost("/auth/admin-login", { email: email, password: password });
          setSession(adminResult.token, "admin");
          toast("Logged in as admin.");
          navigate("/admin");
        }catch(adminErr){
          showFormErr("Invalid email or password.");
        }
      }
    });
    document.querySelectorAll('[data-action="loginRole"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll('[data-action="loginRole"]').forEach(function(b){b.classList.remove("active");});
        btn.classList.add("active");
        document.getElementById("loginRoleField").value = btn.getAttribute("data-role");
      });
    });
  }

  document.querySelectorAll('[data-action="oauth"]').forEach(function(btn){
    btn.addEventListener("click", function(){
      var kind = btn.getAttribute("data-kind") || "creator";
      window.location.href = "/auth/google?role=" + encodeURIComponent(kind);
    });
  });

  var socialForm = document.getElementById("socialForm");
  if(socialForm){
    socialForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var data = new FormData(socialForm);
      try{
        await apiPut("/creators/me/socials", { twitter: data.get("twitter"), tiktok: data.get("tiktok"), instagram: data.get("instagram"), youtube: data.get("youtube") });
        toast("Connected accounts saved.");
        render();
      }catch(err){ toast(err.message, true); }
    });
  }

  document.querySelectorAll('[data-action="submitLink"], [data-action="editSubmission"]').forEach(function(btn){
    btn.addEventListener("click", async function(){
      var campId = btn.getAttribute("data-camp");
      if(btn.getAttribute("data-action")==="editSubmission"){
        var card = btn.closest(".camp-card");
        card.querySelector(".camp-actions").insertAdjacentHTML("beforebegin",
          '<div class="submit-row" style="grid-template-columns: 1fr auto;margin-top:10px;">' +
            '<div class="field"><label>New link to your post</label><input type="url" data-field="postUrl" placeholder="https://x.com/you/status/..."></div>' +
            '<button class="btn btn-primary btn-sm" data-action="submitLink" data-camp="'+campId+'">Submit link</button>' +
          '</div>');
        wireGlobal();
        return;
      }
      var card = btn.closest(".camp-card");
      var input = card.querySelector('[data-field="postUrl"]');
      var postUrl = (input ? input.value : "").trim();
      if(!postUrl){ toast("Paste a link to your post first.", true); return; }
      try{
        await apiPost("/creators/me/campaigns/"+campId+"/submit", { postUrl: postUrl });
        toast("Link submitted — we\'ll review it soon.");
        render();
      }catch(err){ toast(err.message, true); }
    });
  });

  var campaignForm = document.getElementById("campaignForm");
  if(campaignForm){
    campaignForm.addEventListener("submit", async function(e){
      e.preventDefault();
      var data = new FormData(campaignForm);
      try{
        await apiPost("/projects/campaigns", {
          title: data.get("title"), description: data.get("description"),
          creatorsNeeded: Number(data.get("creatorsNeeded")), durationDays: Number(data.get("durationDays")),
          amountSent: data.get("amountSent") || null, paymentSent: document.getElementById("paymentSentBox").checked
        });
        toast("Campaign created.");
        navigate("/project/campaigns");
      }catch(err){ toast(err.message, true); }
    });
  }

  document.querySelectorAll('[data-action="markPaymentSent"]').forEach(function(btn){
    btn.addEventListener("click", async function(){
      var campId = btn.getAttribute("data-camp");
      try{
        await apiPost("/projects/campaigns/"+campId+"/mark-payment-sent", {});
        toast("Marked as sent — we\'ll verify it shortly.");
        render();
      }catch(err){ toast(err.message, true); }
    });
  });

  document.querySelectorAll('[data-action="verifyPayment"]').forEach(function(btn){
    btn.addEventListener("click", async function(){
      var campId = btn.getAttribute("data-camp");
      try{
        var result = await apiPost("/admin/campaigns/"+campId+"/verify-payment", {});
        toast("Payment verified — campaign is live.");
        if(result.projectEmail){
          showEmailDraft(result.projectEmail,
            "Nexora: payment received for \""+result.campaign.title+"\"",
            "Hi "+(result.projectName||"there")+",\n\nWe've confirmed your payment for \""+result.campaign.title+"\" — your campaign is now live and we're matching creators to it.\n\nWe'll keep you updated as creators post and we verify results.\n\nThanks,\nNexora"
          );
        }
        render();
      }catch(err){ toast(err.message, true); }
    });
  });

  document.querySelectorAll('[data-action="assignCreator"]').forEach(function(btn){
    btn.addEventListener("click", async function(){
      var campId = btn.getAttribute("data-camp");
      var select = btn.parentElement.querySelector(".assign-select");
      var creatorId = select ? select.value : "";
      if(!creatorId){ toast("No creator selected.", true); return; }
      try{
        await apiPost("/admin/campaigns/"+campId+"/assign", { creatorId: creatorId });
        toast("Creator assigned.");
        render();
      }catch(err){ toast(err.message, true); }
    });
  });
  document.querySelectorAll('[data-action="unassignCreator"]').forEach(function(btn){
    btn.addEventListener("click", async function(){
      try{
        await apiPost("/admin/campaigns/"+btn.getAttribute("data-camp")+"/unassign", { creatorId: btn.getAttribute("data-creator") });
        toast("Creator removed from campaign.");
        render();
      }catch(err){ toast(err.message, true); }
    });
  });

  document.querySelectorAll('[data-action="suggestPayout"]').forEach(function(btn){
    btn.addEventListener("click", async function(){
      var card = btn.closest(".camp-card");
      var views = Number(card.querySelector(".rv-views").value) || 0;
      var likes = Number(card.querySelector(".rv-likes").value) || 0;
      try{
        var result = await apiPost("/admin/suggest-payout", { views: views, likes: likes });
        card.querySelector(".rv-payout").value = result.suggested;
      }catch(err){ toast(err.message, true); }
    });
  });
  document.querySelectorAll('[data-action="reviewSubmission"]').forEach(function(btn){
    btn.addEventListener("click", async function(){
      var campId = btn.getAttribute("data-campaign"), creatorId = btn.getAttribute("data-creator");
      var card = btn.closest(".camp-card");
      var views = card.querySelector(".rv-views").value;
      var likes = card.querySelector(".rv-likes").value;
      var payout = card.querySelector(".rv-payout").value;
      if(payout === ""){ toast("Enter a payout amount (use Suggest, or type your own).", true); return; }
      try{
        await apiPost("/admin/submissions/"+campId+"/"+creatorId+"/review", { views: views, likes: likes, payout: payout });
        toast("Review saved.");
        render();
      }catch(err){ toast(err.message, true); }
    });
  });
  document.querySelectorAll('[data-action="markPaid"]').forEach(function(btn){
    btn.addEventListener("click", async function(){
      var campId = btn.getAttribute("data-campaign"), creatorId = btn.getAttribute("data-creator");
      try{
        var result = await apiPost("/admin/submissions/"+campId+"/"+creatorId+"/mark-paid", {});
        toast("Marked as paid.");
        if(result.creatorEmail){
          showEmailDraft(result.creatorEmail,
            "Nexora: your payout has been sent",
            "Hi "+(result.creatorName||"there")+",\n\nWe've sent "+fmtMoney(result.amount)+" to your registered wallet for your work on \""+(result.campaignTitle||"your campaign")+"\".\n\nThanks for the great work!\n\nNexora"
          );
        }
        render();
      }catch(err){ toast(err.message, true); }
    });
  });

  function showFormErr(msg){
    var el = document.getElementById("formErr");
    if(el) el.innerHTML = '<div class="error-box">'+escapeHtml(msg)+'</div>';
  }
}

/* =========================================================
   INIT
========================================================= */
render();
})();

</script>
</body>
</html>
